<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cheie de instalare OpenAliment</title><style>body{font:16px/1.7 system-ui;max-width:800px;margin:50px auto;padding:25px;background:#f8f7f1;color:#173f34}button{padding:12px 20px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:20px;border:1px solid #d4ddcd}label{font-weight:600;display:block}</style><h1>Cheie pentru instalarea OpenAliment</h1><p>Deschide acest fișier local. Nu trimite cheia prin chat și nu încărca această pagină în document root. Generarea se face numai în browserul tău.</p><button id="generate">Generează o cheie nouă</button><label>Token pentru formularul de instalare</label><pre id="token">—</pre><label>Valoarea setup_token_hash din config/local.php</label><pre id="hash">—</pre><script>document.getElementById('generate').addEventListener('click',async()=>{const b=crypto.getRandomValues(new Uint8Array(32));const t=Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));document.getElementById('token').textContent=t;document.getElementById('hash').textContent=Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('')});</script></html>
